name: release

# Push a tag like v1.0.0 to build binaries for every platform and publish a
# GitHub release with them. Or start it by hand (Actions → release → Run
# workflow) with a version: it builds the selected branch and creates the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v1.0.0 (tag is created on the selected branch if missing)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "version must look like v1.2.3, got $TAG" >&2; exit 1 ;; esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: ./scripts/build-release.sh "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "ku-storage $TAG" --generate-notes --target "$GITHUB_SHA"
          fi
